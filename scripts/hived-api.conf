log-appender = {"appender":"stderr","stream":"std_error","time_format":"iso_8601_milliseconds"}
log-logger = {"name":"default","level":"info","appender":"stderr"}

plugin = chain witness account_by_key account_by_key_api database_api condenser_api block_api json_rpc webserver state_snapshot
shared-file-size = 8G
webserver-http-endpoint = 127.0.0.1:18090
webserver-thread-pool-size = 4

# Disable P2P sync entirely so hived stays at the truncated block_log
# head. Without this, hived dials seed nodes and pulls fresh blocks,
# advancing state past the checkpoint we want to inspect.
p2p-endpoint = 127.0.0.1:0
p2p-max-connections = 0
p2p-seed-node =
